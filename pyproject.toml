[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adviverse"
version = "0.1.0"
description = "Adviverse API client (Python)"
requires-python = ">=3.9"
dependencies = ["urllib3>=2", "python-dateutil", "pydantic>=2", "typing-extensions>=4.7.1"]

[tool.setuptools.packages.find]
include = ["adviverse*", "adviverse_client*"]
